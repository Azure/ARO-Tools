name: gh-aw recompile
on:
  schedule:
  - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gh-aw-recompile
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    outputs:
      changed: ${{ steps.prepare.outputs.changed }}
    steps:
    - name: Checkout default branch
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      with:
        ref: ${{ github.event.repository.default_branch }}
        persist-credentials: false
        fetch-depth: 0
    - name: Install released gh-aw compiler
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh extension install github/gh-aw
    - name: Validate compiler upgrade
      id: prepare
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_BASE_REF: ${{ github.event.repository.default_branch }}
      run: bash hack/gh-aw-recompile.sh --prepare-only
    - name: Store validated patch
      if: steps.prepare.outputs.changed == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: gh-aw-upgrade
        path: ${{ runner.temp }}/gh-aw-upgrade
        if-no-files-found: error
        retention-days: 1
  publish:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout default branch
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      with:
        ref: ${{ github.event.repository.default_branch }}
        persist-credentials: false
        fetch-depth: 0
    - name: Download validated patch
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: gh-aw-upgrade
        path: ${{ runner.temp }}/gh-aw-upgrade
    - name: Mint aro-hcp-robot App token
      id: app-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ secrets.DEPENDABOT_APP_CLIENT_ID }}
        private-key: ${{ secrets.DEPENDABOT_APP_PRIVATE_KEY }}
        permission-contents: write
        permission-pull-requests: write
        permission-workflows: write
    - name: Configure App git identity
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        set -euo pipefail
        bot_login='aro-hcp-robot[bot]'
        bot_id=$(gh api "/users/${bot_login}" --jq '.id')
        git config --global user.name "$bot_login"
        git config --global user.email "${bot_id}+${bot_login}@users.noreply.github.com"
        gh auth setup-git
    - name: Publish validated compiler upgrade
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        GITHUB_BASE_REF: ${{ github.event.repository.default_branch }}
      run: bash hack/gh-aw-recompile.sh --publish-only
